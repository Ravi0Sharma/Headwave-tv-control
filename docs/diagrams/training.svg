<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="training-title training-desc"><title id="training-title">Custom hand poses: from samples to a model</title><desc id="training-desc">The workflow is prepared; personal training data and measured results will be added later.</desc><defs><style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono&amp;display=swap");</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="960" height="600" fill="#f5f5f5"/><text x="56" y="48" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">HEADWAVE / ARCHITECTURE</text><text x="56" y="92" font-size="28" font-family="'Instrument Serif', serif" font-weight="400" text-anchor="start" fill="#2d3142">Custom hand poses: from samples to a model</text><text x="56" y="124" font-size="12" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start" fill="#4f5d75">The workflow is prepared; personal training data and measured results will be added later.</text><line x1="200.0" y1="276" x2="232.0" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="376.0" y1="276" x2="408.0" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="552.0" y1="276" x2="584.0" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="728.0" y1="276" x2="760.0" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="56.0" y="228" width="144" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="68.0" y="248" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">MAC / SPACE KEY</text><text x="128.0" y="277" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" fill="#2d3142">Collect poses</text><text x="128.0" y="298" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">headwave collect</text><rect x="232.0" y="228" width="144" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="244.0" y="248" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">DATA / XYZ</text><text x="304.0" y="277" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" fill="#2d3142">Labeled points</text><text x="304.0" y="298" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">gestures.jsonl</text><rect x="408.0" y="228" width="144" height="96" rx="6" fill="#fbe9e0" stroke="#eb6c36" stroke-width="1"/><text x="420.0" y="248" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">MAC / NORMALIZE</text><text x="480.0" y="277" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" fill="#2d3142">Build model</text><text x="480.0" y="298" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">headwave train</text><rect x="584.0" y="228" width="144" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="596.0" y="248" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">TEST / NEW SESSION</text><text x="656.0" y="277" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" fill="#2d3142">Test new poses</text><text x="656.0" y="298" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">--custom-model</text><rect x="760.0" y="228" width="144" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="772.0" y="248" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">DEPLOY / LATER</text><text x="832.0" y="277" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" fill="#2d3142">Copy to Pi</text><text x="832.0" y="298" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">custom.json</text><text x="56" y="396" font-size="12" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start" fill="#2d3142">Training here prepares stored examples for comparison using five nearest neighbors.</text><text x="56" y="424" font-size="12" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start" fill="#2d3142">Choose gestures first. Collect intended poses and none. Add photos and measured results later.</text><line x1="56" y1="536" x2="904" y2="536" stroke="#bfc0c0"/><text x="56" y="558" font-size="11" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start" fill="#4f5d75">Orange highlights model preparation. Arrows show how data and model files move.</text><text x="56" y="580" font-size="11" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start" fill="#4f5d75">Collection stores no photos · MediaPipe&#x27;s neural network is not retrained</text></svg>