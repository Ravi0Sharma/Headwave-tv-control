width="1"/><text x="68.0" y="248" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">01 / COLLECT</text><text x="128.0" y="277" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" fill="#2d3142">Collect poses</text><text x="128.0" y="298" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">headwave collect</text><rect x="232.0" y="228" width="144" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="244.0" y="248" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">02 / DATA</text><text x="304.0" y="277" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" fill="#2d3142">Labeled points</text><text x="304.0" y="298" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">gestures.jsonl</text><rect x="408.0" y="228" width="144" height="96" rx="6" fill="#fbe9e0" stroke="#eb6c36" stroke-width="1"/><text x="420.0" y="248" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">03 / TRAIN</text><text x="480.0" y="277" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" fill="#2d3142">Build model</text><text x="480.0" y="298" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">headwave train</text><rect x="584.0" y="228" width="144" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="596.0" y="248" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">04 / TEST</text><text x="656.0" y="277" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" fill="#2d3142">Test new poses</text><text x="656.0" y="298" font-size="9" font-famil