<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="preprocessing-title preprocessing-desc"><title id="preprocessing-title">Preparing the hand landmarks</title><desc id="preprocessing-desc">features() describes hand shape using coordinates relative to the wrist.</desc><defs><style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono&amp;display=swap");</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="960" height="600" fill="#f5f5f5"/><text x="56" y="48" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">HEADWAVE / ARCHITECTURE</text><text x="56" y="92" font-size="28" font-family="'Instrument Serif', serif" font-weight="400" text-anchor="start" fill="#2d3142">Preparing the hand landmarks</text><text x="56" y="124" font-size="12" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start" fill="#4f5d75">features() describes hand shape using coordinates relative to the wrist.</text><line x1="232.0" y1="276" x2="280.0" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="456.0" y1="276" x2="504.0" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="680.0" y1="276" x2="728.0" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="56.0" y="228" width="176" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="68.0" y="248" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">01 / INPUT</text><text x="144.0" y="277" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" fill="#2d3142">21 landmarks</text><text x="144.0" y="298" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">21 × (x, y, z)</text><rect x="280.0" y="228" width="176" height="96" rx="6" fill="#fbe9e0" stroke="#eb6c36" stroke-width="1"/><text x="292.0" y="248" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">02 / RELATIVE</text><text x="368.0" y="277" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" fill="#2d3142">Wrist as origin</text><text x="368.0" y="298" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">p[i] − p[0]</text><rect x="504.0" y="228" width="176" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="516.0" y="248" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">03 / SCALE</text><text x="592.0" y="277" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" fill="#2d3142">Normalize scale</text><text x="592.0" y="298" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">v / max(abs(v))</text><rect x="728.0" y="228" width="176" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="740.0" y="248" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">04 / FEATURES</text><text x="816.0" y="277" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" fill="#2d3142">63 feature values</text><text x="816.0" y="298" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">21 × 3 = 63</text><text x="56" y="396" font-size="12" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start" fill="#2d3142">Point 0 is the wrist. Fingertips are points 4, 8, 12, 16, and 20.</text><text x="56" y="424" font-size="12" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start" fill="#2d3142">Translation and scale matter less. Rotation and left/right hand differences are not removed.</text><line x1="56" y1="536" x2="904" y2="536" stroke="#bfc0c0"/><text x="56" y="558" font-size="11" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start" fill="#4f5d75">Orange highlights the coordinate reference. Arrows show the preprocessing order.</text><text x="56" y="580" font-size="11" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start" fill="#4f5d75">XYZ comes from the model; z is not a distance in meters. Personal hand photos will be added later.</text></svg>