<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="pipeline-title pipeline-desc"><title id="pipeline-title">From a hand gesture to a TV key</title><desc id="pipeline-desc">Frames are processed locally. Recognizing a pose and choosing its TV key are separate decisions.</desc><defs><style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono&amp;display=swap");</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="960" height="600" fill="#f5f5f5"/><text x="56" y="48" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">HEADWAVE / ARCHITECTURE</text><text x="56" y="92" font-size="28" font-family="'Instrument Serif', serif" font-weight="400" text-anchor="start" fill="#2d3142">From a hand gesture to a TV key</text><text x="56" y="124" font-size="12" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start" fill="#4f5d75">Frames are processed locally. Recognizing a pose and choosing its TV key are separate decisions.</text><line x1="200.0" y1="276" x2="232.0" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="376.0" y1="276" x2="408.0" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="552.0" y1="276" x2="584.0" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="728.0" y1="276" x2="760.0" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="56.0" y="228" width="144" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="68.0" y="248" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">01 / CAPTURE</text><text x="128.0" y="277" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" fill="#2d3142">Camera + OpenCV</text><text x="128.0" y="298" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">frame / BGR → RGB</text><rect x="232.0" y="228" width="144" height="96" rx="6" fill="#fbe9e0" stroke="#eb6c36" stroke-width="1"/><text x="244.0" y="248" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">02 / RECOGNIZE</text><text x="304.0" y="277" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" fill="#2d3142">MediaPipe</text><text x="304.0" y="298" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">21 points + pose</text><rect x="408.0" y="228" width="144" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="420.0" y="248" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">03 / ACCEPT</text><text x="480.0" y="277" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" fill="#2d3142">Gesture filter</text><text x="480.0" y="298" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">score + hold time</text><rect x="584.0" y="228" width="144" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="596.0" y="248" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">04 / MAP</text><text x="656.0" y="277" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" fill="#2d3142">Choose TV key</text><text x="656.0" y="298" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">config.gestures</text><rect x="760.0" y="228" width="144" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="772.0" y="248" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">05 / LIVE</text><text x="832.0" y="277" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" fill="#2d3142">ADB → Google TV</text><text x="832.0" y="298" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">input keyevent</text><text x="56" y="396" font-size="12" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start" fill="#2d3142">Dry run: the same analysis runs, but intended commands are printed in the terminal.</text><text x="56" y="424" font-size="12" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start" fill="#2d3142">Camera Module 3 needs a Picamera2 adapter before OpenCV; this is not implemented yet.</text><line x1="56" y1="536" x2="904" y2="536" stroke="#bfc0c0"/><text x="56" y="558" font-size="11" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start" fill="#4f5d75">Orange highlights recognition. Arrows carry frame data and accepted commands.</text><text x="56" y="580" font-size="11" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start" fill="#4f5d75">Mac for development · Raspberry Pi for operation · TV commands require --live</text></svg>