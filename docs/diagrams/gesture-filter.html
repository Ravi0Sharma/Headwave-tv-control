<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One command per held gesture — Headwave</title><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono&amp;display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f5f5f5;color:#2d3142;font-family:Geist,system-ui,sans-serif}main{max-width:1100px;margin:auto}svg{width:100%;height:auto;display:block}footer{font-size:12px;padding:16px 0;color:#4f5d75}a{color:#2e5aa8}@media print{body{padding:0}footer{display:none}}</style></head><body><main><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="gesture-filter-title gesture-filter-desc"><title id="gesture-filter-title">One command per held gesture</title><desc id="gesture-filter-desc">The filter remembers earlier frames so a held hand cannot keep sending the same key.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="960" height="600" fill="#f5f5f5"/><text x="56" y="48" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">HEADWAVE / STATE MACHINE</text><text x="56" y="92" font-size="28" font-family="'Instrument Serif', serif" font-weight="400" text-anchor="start" fill="#2d3142">One command per held gesture</text><text x="56" y="124" font-size="12" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start" fill="#4f5d75">The filter remembers earlier frames so a held hand cannot keep sending the same key.</text><line x1="272" y1="276" x2="380" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="294.0" y="248" width="64" height="20" fill="#f5f5f5"/><text x="326" y="262" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">NEW POSE</text><line x1="580" y1="276" x2="688" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="586.0" y="248" width="96" height="20" fill="#f5f5f5"/><text x="634" y="262" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">TIMING PASSED</text><path d="M 480,228 V 184 Q 480,176 472,176 H 180 Q 172,176 172,184 V 228" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="284.0" y="148" width="84" height="20" fill="#f5f5f5"/><text x="326" y="162" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">HOLD BROKEN</text><path d="M 788,324 V 392 Q 788,400 780,400 H 180 Q 172,400 172,392 V 324" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="430.0" y="372" width="100" height="20" fill="#f5f5f5"/><text x="480" y="386" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">RELEASE ≥0.35s</text><rect x="72" y="228" width="200" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="84" y="248" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">01 / ARMED</text><text x="172.0" y="277" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" fill="#2d3142">Ready</text><text x="172.0" y="298" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">waiting for pose</text><rect x="380" y="228" width="200" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="392" y="248" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">02 / CANDIDATE</text><text x="480.0" y="277" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" fill="#2d3142">Measure hold</text><text x="480.0" y="298" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">same pose ≥0.5 s</text><rect x="688" y="228" width="200" height="96" rx="6" fill="#fbe9e0" stroke="#eb6c36" stroke-width="1"/><text x="700" y="248" font-size="8" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" fill="#4f5d75">03 / LATCHED</text><text x="788.0" y="277" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle" fill="#2d3142">Fired and locked</text><text x="788.0" y="298" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" fill="#4f5d75">one command</text><text x="56" y="456" font-size="12" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start" fill="#2d3142">Score ≥0.75 is required. Firing also requires ≥1.0 s since the previous event.</text><text x="56" y="484" font-size="12" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start" fill="#2d3142">A changed candidate restarts the hold timer. Changing poses after firing does not unlock.</text><line x1="56" y1="536" x2="904" y2="536" stroke="#bfc0c0"/><text x="56" y="558" font-size="11" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start" fill="#4f5d75">Orange marks the latched state. Arrows show conditions for state changes.</text><text x="56" y="580" font-size="11" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start" fill="#4f5d75">Release = no hand, an unmapped pose, or a low score. Brief dropouts do not rearm.</text></svg><footer>Headwave · Diagram Design · <a href="../../README.md">Project overview</a></footer></main></body></html>
